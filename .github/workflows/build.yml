name: Build Gravitation Tweak (RootHide & Rootless)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Homebrew dependencies
      run: |
        brew install ldid dpkg
    
    - name: Install RootHide Theos
      run: |
        git clone --recursive https://github.com/roothide/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
    
    - name: Download iOS SDKs
      run: |
        git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos-sdks
        cp -R $HOME/theos-sdks/* $HOME/theos/sdks/
        ls -la $HOME/theos/sdks/

    - name: Build RootHide & Rootless packages
      run: |
        export THEOS=$HOME/theos
        mkdir -p dist
        
        VERSION=$(grep '^Version:' control | awk '{print $2}')
        echo "Building version: $VERSION"

        # 1. Build RootHide (iphoneos-arm64e)
        echo "=== Building for RootHide ==="
        python3 -c "c=open('control').read().replace('iphoneos-arm64\n','iphoneos-arm64e\n');open('control','w').write(c)"
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
        cp packages/*.deb dist/com.ymkeee.gravitation_${VERSION}_roothide.deb
        rm -rf packages/*

        # 2. Build Rootless (iphoneos-arm64)
        echo "=== Building for Rootless ==="
        python3 -c "c=open('control').read().replace('iphoneos-arm64e','iphoneos-arm64');open('control','w').write(c)"
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        cp packages/*.deb dist/com.ymkeee.gravitation_${VERSION}_rootless.deb
        rm -rf packages/*

        # Restore original control file
        git checkout control
        
        echo "=== Built Packages ==="
        ls -lah dist/

        echo "=== RootHide package contents ==="
        dpkg-deb -c dist/com.ymkeee.gravitation_${VERSION}_roothide.deb

        echo "=== Rootless package contents ==="
        dpkg-deb -c dist/com.ymkeee.gravitation_${VERSION}_rootless.deb
    
    - name: Upload .deb artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Gravitation-deb-packages
        path: dist/*.deb
        if-no-files-found: error

    - name: Extract Version from control
      id: get_version
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        VERSION=$(grep '^Version:' control | awk '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Publish GitHub Release (RootHide & Rootless)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: "Gravitation v${{ steps.get_version.outputs.version }} (RootHide & Rootless)"
        body: |
          ## Gravitation v${{ steps.get_version.outputs.version }} 🚀
          
          ### 📦 Доступно две версии / Two versions available:
          - **`..._roothide.deb`** — Для **Dopamine RootHide** (iOS 15.0 – 16.7+).
          - **`..._rootless.deb`** — Для стандартного **Rootless** (**Dopamine Rootless**, **Palera1n**, **XinaA15**, etc.).
          
          ---
          
          ### ✨ Что нового в v${{ steps.get_version.outputs.version }}:
          - ⚙️ **Пункт настроек в iOS Settings (PreferenceLoader):** Твик теперь отображается в Настройках iOS с красивой иконкой и подробными переключателями.
          - 🚫 **Чистые иконки без наезжающего текста:** Названия приложений скрываются во время падения, чтобы повернутый текст не перекрывал иконки, и плавно возвращаются на место.
          - ⏰ **Хитбокс статус-бара (время и батарея):** Предотвращает залезание иконок на часы и индикатор заряда сверху экрана (переключается в настройках).
          - 🏝 **Хитбокс Dynamic Island:** Физический отскок от Dynamic Island на iPhone 14 Pro Max.
          - 📥 **Управление падением за док (Dock Barrier):** Переключатель между падением за док-бар или упругим отскоком от верхней границы дока.
          - 📱 **Гравитация иконок в доке:** Опция включения/выключения гравитации для иконок в нижнем доке (Телефон, Safari, Сообщения, Музыка).
          - 🔄 **Прямое обновление в Sileo:** Повышена версия для возможности нажать «Обновить» в пакетном менеджере.
          
          ---
          
          ### 📲 Установка / Installation:
          1. Скачайте нужный `.deb` ниже (**roothide** для RootHide или **rootless** для Rootless).
          2. Откройте в **Sileo**, **Zebra** или **Filza**.
          3. Нажмите **«Обновить»** (или **«Установить»**).
          4. Сделайте быстрый респринг (*Respring*).
        files: dist/*.deb
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
