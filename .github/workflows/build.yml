name: Build Gravitation Tweak (RootHide)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Homebrew dependencies
      run: |
        brew install ldid
    
    - name: Install RootHide Theos
      run: |
        git clone --recursive https://github.com/roothide/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
    
    - name: Download iOS SDKs
      run: |
        git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos-sdks
        cp -R $HOME/theos-sdks/* $HOME/theos/sdks/
        ls -la $HOME/theos/sdks/
    
    - name: Build RootHide package
      run: |
        export THEOS=$HOME/theos
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
    
    - name: List packages
      run: |
        ls -lah packages/
    
    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gravitation-RootHide-deb
        path: packages/*.deb
        if-no-files-found: error

    - name: Extract Version from control
      id: get_version
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        VERSION=$(grep '^Version:' control | awk '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Target release version: $VERSION"

    - name: Publish GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: "Gravitation v${{ steps.get_version.outputs.version }}"
        body: |
          ## Gravitation (RootHide Dopamine iOS 15 - 16+) 🚀
          
          **Version ${{ steps.get_version.outputs.version }}**
          
          ### ✨ Improvements & Fixes:
          - **RootHide Dopamine Ready:** Fully compiled for Dopamine RootHide (`iphoneos-arm64e`, A12–A16 / iPhone 14 Pro Max).
          - **Zero Icon Return Bugs:** Icons smoothly glide and bounce back into their pixel-perfect grid locations without any twitching or misplacement.
          - **Full Widget Support:** Interactive widgets (2x2, 2x4, 4x4) tumble with realistic mass or act as solid bounce platforms.
          - **App Launch on Tap:** Tap any icon while falling to open apps immediately.
          - **Home Screen Only:** Completely ignores shakes inside apps (Telegram, Safari, etc.) and on the lockscreen.
          - **Silent:** Zero unwanted vibrations or sounds.
          - **Dynamic Island Collision:** Bounces off the Dynamic Island on iPhone 14 Pro Max.
          
          ### 📲 Installation:
          1. Download the `.deb` file below.
          2. Open in **Sileo**, **Zebra**, or **Filza**.
          3. Tap **Install** or **Update**.
          4. Respring device (`sbreload`).
        files: packages/*.deb
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
